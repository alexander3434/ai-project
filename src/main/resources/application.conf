ktor {
    deployment {
        host = "0.0.0.0"
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.aiturbo.ApplicationKt.module ]
    }
}

deepseek {
    # DeepSeek LLM API — used over HTTP to resolve free-form locations into IANA time zones.
    # The API key is intentionally NOT stored here. It is loaded from:
    #   1. the DEEPSEEK_API_KEY environment variable, or
    #   2. a local git-ignored .env file in the project root (see README).
    baseUrl = "https://api.deepseek.com"
    baseUrl = ${?DEEPSEEK_BASE_URL}
    apiKey = ""
    apiKey = ${?DEEPSEEK_API_KEY}
    model = "deepseek-chat"
    model = ${?DEEPSEEK_MODEL}
}
