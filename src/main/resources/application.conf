ktor {
    deployment {
        host = "0.0.0.0"
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.aiturbo.ApplicationKt.module ]
    }
}

deepseek {
    # DeepSeek LLM API — the default provider behind Koog (a request may pick the
    # local Ollama provider instead, see the `ollama` section below). Every request
    # (the weather agent, the fueling agent and the free-form location → IANA time
    # zone resolution) goes through the Koog prompt executor; the application itself
    # never calls the API directly.
    # The API key is intentionally NOT stored here. It is loaded from:
    #   1. the DEEPSEEK_API_KEY environment variable, or
    #   2. a local git-ignored .env file in the project root (see README).
    baseUrl = "https://api.deepseek.com"
    baseUrl = ${?DEEPSEEK_BASE_URL}
    apiKey = ""
    apiKey = ${?DEEPSEEK_API_KEY}
    model = "deepseek-flash"
    model = ${?DEEPSEEK_MODEL}
}

ollama {
    # Local LLM (no API key). The server is optional: nothing connects at startup,
    # a local request fails with the documented 503 when Ollama is not running.
    baseUrl = "http://localhost:11434"
    baseUrl = ${?OLLAMA_BASE_URL}
    model = "qwen3:8b"
    model = ${?OLLAMA_MODEL}
    # Request and socket-read wait for one generation; a CPU-only model can need
    # minutes and pauses between streamed bytes. The connect timeout stays at 10 s,
    # so an unreachable Ollama still fails fast (503).
    timeoutSeconds = "120"
    timeoutSeconds = ${?OLLAMA_TIMEOUT_SECONDS}
}

db {
    # PostgreSQL settings. Defaults point at the local Docker container "TimeAndData"
    # (host port 5439 → container 5432, database mydb2 — see README).
    host = "localhost"
    host = ${?DB_HOST}
    port = "5439"
    port = ${?DB_PORT}
    name = "mydb2"
    name = ${?DB_NAME}
    user = "myuser"
    user = ${?DB_USER}
    # The password is intentionally left empty here. It is resolved in order:
    #   1. the DB_PASSWORD environment variable,
    #   2. a local git-ignored .env file,
    #   3. the local development default ("mysecret").
    password = ""
    password = ${?DB_PASSWORD}
}

stageDb {
    # Stage PostgreSQL, read-only (the fueling order lookup). The password never
    # lives in this file; it is resolved in order:
    #   1. the STAGE_DB_PASSWORD environment variable,
    #   2. a local git-ignored .env file (no default — see README).
    host = "postgres.stage.turboapp.ru"
    host = ${?STAGE_DB_HOST}
    port = "25432"
    port = ${?STAGE_DB_PORT}
    name = "fueling"
    name = ${?STAGE_DB_NAME}
    user = "fueling"
    user = ${?STAGE_DB_USER}
    password = ""
    password = ${?STAGE_DB_PASSWORD}
    timeoutSeconds = "10"
    timeoutSeconds = ${?STAGE_DB_TIMEOUT_SECONDS}
}

weather {
    # Open-Meteo — free weather service, no API key required.
    geocodingBaseUrl = "https://geocoding-api.open-meteo.com"
    geocodingBaseUrl = ${?WEATHER_GEOCODING_BASE_URL}
    forecastBaseUrl = "https://api.open-meteo.com"
    forecastBaseUrl = ${?WEATHER_FORECAST_BASE_URL}
    language = "ru"
    language = ${?WEATHER_LANGUAGE}
}
