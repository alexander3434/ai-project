# Изолированное окружение: локальная БД + бэкенд + фронтенд в контейнерах.
# Запуск всего стека:  docker compose up -d --build
# Логи:                 docker compose logs -f backend
# Остановить:           docker compose down
# Хостовые команды (./gradlew run, npm run dev) продолжают работать как раньше.
name: ai-turbo

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecret
      POSTGRES_DB: mydb2
    ports:
      - "5439:5432"        # хост-порт как раньше (TimeAndData)
    volumes:
      - ai-turbo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb2"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_HOST: db          # локальная БД теперь по имени сервиса
      DB_PORT: "5432"
      DB_USER: myuser
      DB_PASSWORD: mysecret
      DB_NAME: mydb2
      # DEEPSEEK_API_KEY и STAGE_DB_PASSWORD попадают из git-ignored .env
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../ai-turbo-web
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    depends_on:
      - backend

volumes:
  ai-turbo-db-data:
